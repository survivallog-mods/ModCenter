<title>ModCenter 面板原型 · v2（对照 panel.js 1.7.0）</title>
<!--
  ============================================================================
  ModCenter 面板 UI 原型（项目资产，独立可开：双击浏览器打开即可）
  ============================================================================
  对应实现：同目录 panel.js（内嵌资源 SurvivalLog.ModCenter.panel.js，v1.7.0）。
  本文件是布局/样式的**可视对照稿**：CSS 与 DOM 结构逐字对照 panel.js 的
  CSS 字符串与 renderSide/renderCfg/renderSideOrder/各弹窗模板；
  模拟数据覆盖全部状态（七形图标 / 仓库五态 / 排序模式 / 各弹窗 / 待生效条 / toast）。

  用途：调整布局样式先在这里改、在浏览器里看效果；定稿后把改动**同步回 panel.js**
  （CSS 字符串 + 对应渲染函数），并保持本文件与 panel.js 一致。DESIGN.md §4 已登记此纪律。

  v3 方向（2026-10-30 作者拍板，本文件已先行实施，panel.js 待回写）：
    ① 提示信息全面精简——短句、白话、无内部术语；冲突分两级：
       **严重**（红 ⚠，明确冲突只能二选一/多选一）与**普通告警**（橙，可能有问题；
       ⇄脚本碰撞 / ◎功能叠加，靠字形区分）。原 L1/L2/L3 三级灰标退役（gray 色级废除）。
    ② 取消独立「套件仓库」页——顶部一个「检查更新」按钮即可；更新入口 =
       列表行内图标（点击直接进确认弹窗）+ 详情页「维护」区按钮（更新到 X / 安装 X）；
       **按钮一律不进左侧 mod 列表**。侧栏仓库入口卡与补丁碰撞行删除；
       碰撞汇总挪到底部图例栏（有碰撞才显示）。

  分区导览（与 panel.js 对照）：
    <style> 第一段      = panel.js CSS 字符串原样（仅把 JS 拼串展开为普通 CSS，值未动）
    <style> 第二段      = 原型页专用（demo-bar / z-index 覆盖），不随回写
    MOCK 区             = 模拟快照/仓库/排序/扫描数据（Meta.cs 取材，非真实玩家数据）
    渲染区              = panel.js render* / *Html 函数移植（发消息一律 send() 打桩）
    demo 区             = 场景切换条（原 v2 原型的 demo-bar 同思路）

  注意：
  · 面板 CSS 每条规则仍锚定 #__mc_overlay（游戏内零泄漏依赖），回写时直接复制整段。
  · 滑条/开关/拖拽/键盘排序等交互在本页可用（纯本地模拟）；凡写 cfg/网络/重启动作
    一律打桩不落地，只弹（原型）toast。
  ============================================================================
-->

/* ============================================================================
 * 渲染函数（panel.js 移植；仅发消息处改 send() 打桩，其余逻辑原样）
 * ========================================================================== */

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmt(v) { var n = +v; return isNaN(n) ? String(v) : String(Math.round(n * 1000) / 1000); }
function badgeOf(b) { return BADGE[b] || BADGE.cfg; }

function mods() { return ST.snap ? ST.snap.mods : []; }
function tps() { return ST.snap ? ST.snap.tp : []; }
function findMod(guid) {
  var i, ms = mods();
  for (i = 0; i < ms.length; i++) if (ms[i].guid === guid) return ms[i];
  var ts = tps();
  for (i = 0; i < ts.length; i++) if (ts[i].guid === guid) return ts[i];
  return null;
}
function isTpMod(m) { return tps().indexOf(m) !== -1; }
function curMod() {
  if (ST.sel === '__self') return null;
  var m = ST.sel ? findMod(ST.sel) : null;
  return m || mods()[0] || null;
}
function itemOf(m, g, i) { return (m.groups[g] && m.groups[g].items[i]) || null; }
function clampItem(it, v) {
  if (typeof it.min === 'number' && v < it.min) v = it.min;
  if (typeof it.max === 'number' && v > it.max) v = it.max;
  return v;
}

function swBtn(on, attrs, big) {
  return '<button type="button" class="__mc-mini-sw' + (big ? ' __mc-big' : '') + (on ? ' __mc-on' : '') + '"'
    + attrs + ' aria-checked="' + !!on + '"></button>';
}

function icGlyph(ic) {
  if (ic.g) return ic.g === 'kbw' ? '⊘' : ic.g;
  if (ic.k === 'orange') return ic.click === 'cf' ? '⇄' : '↓';
  if (ic.k === 'red') return '⚠';
  if (ic.k === 'gray') return '◎';
  if (ic.k === 'blue') return '↑';
  if (ic.k === 'amber') return '⟳';
  return '⚠';
}

function icsHtml(m) {
  var ics = m && m.ics;
  if (!ics || !ics.length) return '';
  var h = '<span class="__mc-ics">';
  for (var i = 0; i < ics.length; i++) {
    var ic = ics[i];
    if (!ic || !ic.k || !ic.tip) continue;
    h += '<span class="__mc-ic __mc-' + esc(ic.k) + (ic.w ? ' __mc-weak' : '') + '" data-guid="' + esc(m.guid) + '"'
      + (ic.click ? ' data-click="' + esc(ic.click) + '"' : '')
      + ' title="' + esc(ic.tip) + '" aria-label="' + esc(ic.tip) + '">'
      + esc(icGlyph(ic)) + '</span>';
  }
  return h + '</span>';
}

function repoCounts() {
  var d = ST.repoData, c = { upd: 0, inst: 0, warn: 0 };
  if (!d || !d.rows) return c;
  for (var i = 0; i < d.rows.length; i++) {
    var r = d.rows[i];
    if (r.pending) continue;
    if (r.status === 'update') c.upd++;
    else if (r.status === 'install') c.inst++;
    else if (r.status === 'warn') c.warn++;
  }
  return c;
}

function sideFootHtml(ordMode) {
  return '<div class="__mc-side-foot"><button type="button" data-act="ordtoggle">'
    + (ordMode ? '退出排序模式' : '加载排序模式')
    + '</button></div>';
}

function ordInfoOf(guid) {
  var name = guid, ver = '', enabled = true;
  var rows = ST.ordRows && ST.ordRows.rows;
  if (rows) for (var i = 0; i < rows.length; i++)
    if (rows[i] && rows[i].guid === guid) { name = rows[i].name || guid; ver = rows[i].ver || ''; break; }
  var m = findMod(guid);
  if (m) { name = m.name; enabled = m.enabled !== false; }
  return { m: m, name: name, ver: ver, enabled: enabled };
}

function ordIcsHtml(info) {
  var ics = info.m && info.m.ics;
  if (!ics || !ics.length) return '';
  var h = '';
  for (var i = 0; i < ics.length; i++) {
    var ic = ics[i];
    if (!ic || !ic.k || !ic.tip || ic.click !== 'cf') continue;
    h += '<span class="__mc-ic __mc-' + esc(ic.k) + (ic.w ? ' __mc-weak' : '') + '" style="cursor:default" title="' + esc(ic.tip)
      + '" aria-label="' + esc(ic.tip) + '">' + esc(icGlyph(ic)) + '</span>';
  }
  return h ? '<span class="__mc-ics">' + h + '</span>' : '';
}

function renderSideOrder() {
  var dis = ST.order ? '' : ' disabled';
  var prot = (ST.ordRows && ST.ordRows.prot) || [];
  var protHtml = '';
  if (prot.length) {
    var byG = {}, orderG = [];
    for (var pi = 0; pi < prot.length; pi++) {
      var pg = prot[pi] && prot[pi].g, pd = prot[pi] && prot[pi].d;
      if (!pg || !pd) continue;
      if (!byG[pg]) { byG[pg] = []; orderG.push(pg); }
      if (byG[pg].indexOf(pd) === -1) byG[pg].push(pd);
    }
    if (orderG.length) {
      var parts = [];
      for (var oi = 0; oi < orderG.length; oi++) {
        var g0 = orderG[oi];
        var nm = ordInfoOf(g0).name;
        var deps = byG[g0].map(function (x) { return ordInfoOf(x).name; }).join('、');
        parts.push(nm + '（依赖 ' + deps + '）');
      }
      protHtml = '<div class="__mc-ord-prot">被硬依赖保护 ' + orderG.length + ' 项：' + esc(parts.join('、')) + '</div>';
    }
  }
  var h = '<div class="__mc-ordbar">'
    + '<b style="color:#e8a33d;font-weight:500">排序模式</b> — 拖拽调整顺序，或选中一行按 ↑↓。硬依赖自动保护。'
    + protHtml
    + '<div class="__mc-ord-acts">'
    + '<button type="button" class="__mc-btn __mc-btn-mini" data-act="ordreset"' + dis + '>恢复默认</button>'
    + '<button type="button" class="__mc-btn __mc-btn-pri __mc-btn-mini" data-act="ordsave"' + dis + '>保存顺序</button>'
    + '</div></div>';
  h += '<div class="__mc-cat">加载顺序（默认 = 模组 ID 字母序）</div>';
  if (!ST.order) {
    h += '<div class="__mc-loading">正在读取加载顺序…</div>';
  } else {
    for (var i = 0; i < ST.order.length; i++) {
      var guid = ST.order[i], info = ordInfoOf(guid), n = i + 1;
      h += '<div class="__mc-mod-row __mc-ord-row' + (info.enabled ? '' : ' __mc-off')
        + '" data-guid="' + esc(guid) + '" tabindex="0" draggable="true">'
        + '<span class="__mc-grip" aria-hidden="true">⋮⋮</span>'
        + '<span class="__mc-ver">' + (n < 10 ? '0' : '') + n + '</span>'
        + '<span class="__mc-nm">' + esc(info.name) + '</span>'
        + '<span class="__mc-ver">' + esc(info.ver) + '</span>'
        + '<span class="__mc-sp"></span>'
        + ordIcsHtml(info)
        + '</div>';
    }
  }
  h += sideFootHtml(true);
  S.side.innerHTML = h;
}

function renderSide() {
  if (!S.side) return;
  if (ST.ord) { renderSideOrder(); return; }
  var ms = mods(), ts = tps();
  var h = '<div class="__mc-cat">套件 MOD（' + ms.length + '）</div>';
  for (var i = 0; i < ms.length; i++) {
    var m = ms[i];
    h += '<div class="__mc-mod-row' + (m.enabled ? '' : ' __mc-off')
      + (ST.sel === m.guid ? ' __mc-sel' : '') + '" data-guid="' + esc(m.guid) + '">'
      + '<span class="__mc-st"></span><span class="__mc-nm">' + esc(m.name) + '</span>'
      + icsHtml(m)
      + (m.missing
        ? '<span class="__mc-mini-sw __mc-lock" title="未安装：请到「套件仓库」安装"></span>'
        : swBtn(m.enabled, ' data-act="toggle" data-guid="' + esc(m.guid) + '"')) + '</div>';
  }
  h += '<div class="__mc-cat">面板自身</div>';
  h += '<div class="__mc-mod-row __mc-lock' + (ST.sel === '__self' ? ' __mc-sel' : '')
    + '" data-guid="__self">'
    + '<span class="__mc-st" style="background:#e8a33d;"></span><span class="__mc-nm">' + esc(SELF_NAME) + '</span>'
    + '<span class="__mc-mini-sw __mc-lock" title="防呆：面板不可停用自身"></span></div>';
  h += '<div class="__mc-cat">第三方 MOD（通用 / 声明式）</div>';
  if (ts.length === 0) {
    h += '<div class="__mc-tp-empty">（暂无第三方 mod 接入）</div>';
  } else {
    for (var j = 0; j < ts.length; j++) {
      var t = ts[j];
      h += '<div class="__mc-mod-row' + (t.enabled ? '' : ' __mc-off')

        + icsHtml(t)
        + swBtn(t.enabled, ' data-act="toggle" data-guid="' + esc(t.guid) + '"') + '</div>';
    }
  }
  h += sideFootHtml(false);
  S.side.innerHTML = h;
}

function ctlHtml(it, gi, ii) {
  if (it.t === 'bool') {
    return swBtn(!!it.v, ' data-act="set" data-g="' + gi + '" data-i="' + ii + '"', true);
  }
  if (it.t === 'sel') {
    var opts = (it.opts && it.opts.length) ? it.opts : [it.v];
    var o = '';
    for (var i = 0; i < opts.length; i++)
      o += '<option value="' + esc(opts[i]) + '"' + (opts[i] === it.v ? ' selected' : '') + '>' + esc(opts[i]) + '</option>';
    return '<select data-act="set" data-g="' + gi + '" data-i="' + ii + '">' + o + '</select>';
  }
  if (it.t === 'str') {
    return '<input type="text" value="' + esc(it.v) + '" data-act="set" data-g="' + gi + '" data-i="' + ii + '">';
  }
  var step = (it.st != null) ? it.st : 0.1;
  var hasMin = typeof it.min === 'number', hasMax = typeof it.max === 'number';
  var num = '<input type="text" class="__mc-numbox" inputmode="numeric"'
    + ' data-num="' + (it.t === 'float' ? 'float' : 'int') + '"'
    + ' value="' + fmt(it.v)
    + '" data-act="set" data-g="' + gi + '" data-i="' + ii + '">';
  if (!hasMin || !hasMax) return num;
  return '<input type="range" min="' + it.min + '" max="' + it.max + '" step="' + step + '" value="' + fmt(it.v)
    + '" data-act="set" data-g="' + gi + '" data-i="' + ii + '">' + num;
}

        + '<input type="text" class="__mc-numbox" inputmode="numeric" data-num="int" value="' + bov[idx].w + '" data-act="bov-set" data-idx="' + idx + '" data-k="w" title="宽度（0..40）">'
        + '<span class="__mc-bov-lb">高</span>'
        + '<input type="text" class="__mc-numbox" inputmode="numeric" data-num="int" value="' + bov[idx].h + '" data-act="bov-set" data-idx="' + idx + '" data-k="h" title="高度（0..30）">'
        + '</div>'
        + '<div class="__mc-badge __mc-b-now">⚡ 立即生效</div>'
        + '<button type="button" class="__mc-del" data-act="bov-del" data-idx="' + idx + '" title="删除此柜子">✕</button>'
        + '</div>';
    }
  }
  return h + '</div>';
}

/* 维护区（详情页底部）：更新/安装按钮按仓库态出现；卸载常驻（未安装不显示）。
 * v3：更新按钮只在此处与列表图标两处，不进左侧列表。 */
function maintHtml(m) {
  var r = isTpMod(m) ? null : repoRowOfGuid(m.guid);
  var h = '<div class="__mc-maint"><h3>维护</h3>';
  if (r && r.pending) {
    h += '<div class="__mc-kv"><span class="__mc-kk">更新</span>'
      + '<span style="color:#e8a33d;font-size:12px">⟳ 待生效 · 重启游戏后应用</span></div>';
  } else if (r && r.remote != null && (r.status === 'update' || r.status === 'downgrade' || r.status === 'install' || r.local == null)) {
    var isDown = r.status === 'downgrade';
    var isInst = r.local == null || r.status === 'install';
    var label = isDown ? '降级到 ' + r.remote : (isInst ? '安装 ' + r.remote : '更新到 ' + r.remote);
    var cls = isDown ? '__mc-btn-org' : (isInst ? '__mc-btn-blue' : '__mc-btn-pri');
    var ver = isInst ? '未安装 → ' + r.remote : r.local + ' → ' + r.remote;
    h += '<div class="__mc-kv"><span class="__mc-kk">更新</span>'
      + '<button type="button" class="__mc-btn ' + cls + ' __mc-btn-mini" data-ract="upd" data-repo="' + esc(r.repoKey) + '">' + esc(label) + '</button>'
      + '<span style="font-size:11px;color:#6b7180">' + esc(ver) + '</span></div>';
  }
  if (!m.missing) {
    h += '<div class="__mc-kv"><span class="__mc-kk">卸载</span>'
      + '<button type="button" class="__mc-btn __mc-btn-danger __mc-btn-mini" data-act="uninst" data-guid="' + esc(m.guid) + '">卸载…</button>'
      + '<span style="font-size:11px;color:#6b7180">删文件，重启后生效</span></div>';
  }
  return h + '</div>';
}

/* __self 页专用：只有卸载入口 */
function uninstActHtml(guid) {
  return '<div class="__mc-maint"><h3>维护</h3>'
    + '<div class="__mc-kv"><span class="__mc-kk">卸载</span>'
    + '<button type="button" class="__mc-btn __mc-btn-danger __mc-btn-mini" data-act="uninst" data-guid="' + esc(guid) + '">卸载…</button>'
    + '<span style="font-size:11px;color:#6b7180">需重启两次</span></div></div>';
}

/* ---- 右区：仓库数据访问（无独立页面；驱动行内图标与「维护」区按钮） ---- */

function repoRowOf(key) {
  var d = ST.repoData;
  if (!d || !d.rows || !key) return null;
  for (var i = 0; i < d.rows.length; i++)
    if (d.rows[i].repoKey === key) return d.rows[i];
  return null;
}
function repoRowOfGuid(guid) {
  var d = ST.repoData;
  if (!d || !d.rows || !guid) return null;
  for (var i = 0; i < d.rows.length; i++)
    if (d.rows[i].guid === guid) return d.rows[i];
  return null;
}

function dlStageText(st, pct) {
  if (st === 'down') return '正在下载… ' + (pct || 0) + '%';
  if (st === 'check') return '校验中…';
  if (st === 'unzip') return '解包中…';
  if (st === 'write') return '写入待生效…';
  return '处理中…';
}

/* ---- 右区：配置页（mod 详情 / __self） ---- */

function renderCfg() {
  if (!S.cfg) return;
  if (ST.sel === '__self' || !mods().length) {
    S.cfg.innerHTML = '<div class="__mc-mod-title"><h2>' + esc(SELF_NAME) + '</h2>'
      + '<span class="__mc-en">' + esc(SELF_EN) + '</span></div>'
      + '<div class="__mc-mod-desc">面板自身。不可停用；如需移除，用下方卸载。</div>'
      + uninstActHtml(SELF_GUID);
    return;
  }
  var m = curMod();
  if (!m) return;
  var tp = isTpMod(m);
  var banner = tp
    ? (m.absent
      ? '已停用：当前未加载。启用后下次启动恢复。'
      : (m.soft
        ? '已停用：行为已停止，下次启动不再加载。'
        : '已停用：本次仍在运行，下次启动不再加载。'))
    : (m.missing
      ? '未安装：此页只读。可在下方「维护」安装。'
      : '已停用：改动仍会保存，重新启用后生效。');
  var h = '<div class="__mc-mod-title"><h2>' + esc(m.name) + '</h2><span class="__mc-en">' + esc(m.en) + '</span></div>'
    + '<div class="__mc-mod-desc">' + esc(m.desc) + '</div>'
    + '<div class="__mc-stop-banner' + (m.enabled ? '' : ' __mc-show') + '">' + banner + '</div>';
  for (var gi = 0; gi < m.groups.length; gi++) {
    h += '<div class="__mc-grp"><h3>' + esc(m.groups[gi].title) + '</h3>';
    for (var ii = 0; ii < m.groups[gi].items.length; ii++)
      h += itemHtml(m, m.groups[gi].items[ii], gi, ii);
    h += '</div>';
  }
  if (m.groups.length === 0) {
    h += '<div class="__mc-grp"><h3>配置</h3>'
      + '<div class="__mc-ovr-empty">该 mod 只有启用 / 停用，没有其他设置。</div></div>';
  }
  if (m.ovr) h += ovrHtml(m);
  if (m.bagOvr) h += bagOvrHtml(m);
  h += maintHtml(m);
  S.cfg.innerHTML = h;
}

/* ---- toast ---- */

function toast(main, badge, err, errDetail) {
  if (!S.toastEl) return;
  var small = err
    ? '写入被拒绝' + (errDetail ? '：' + errDetail : '') + '（详见 LogOutput）'
    : (TOAST_SMALL[badge] || TOAST_SMALL.reboot);
  S.toastEl.className = '__mc-toast __mc-show' + (err ? ' __mc-err' : '');
  S.toastEl.innerHTML = '<span>' + esc(main) + '</span><small>' + esc(small) + '</small>';
  clearTimeout(toast._h);
  toast._h = setTimeout(function () { S.toastEl.className = '__mc-toast'; }, 2600);
}
function toastRaw(main, small) {
  if (!S.toastEl) return;
  S.toastEl.className = '__mc-toast __mc-show';
  S.toastEl.innerHTML = '<span>' + esc(main) + '</span><small>' + esc(small || '') + '</small>';
  clearTimeout(toast._h);
  toast._h = setTimeout(function () { S.toastEl.className = '__mc-toast'; }, 3400);
}

/* ---- 浮层弹窗 + 待生效条 ---- */

function chipHtml(k, glyph) {
  return '<span class="__mc-ic __mc-' + k + '" style="cursor:default" aria-hidden="true">' + glyph + '</span>';
}

/* 冲突卡片（v3 两级）：红=严重（只能二选一）/ 橙=普通告警（可能有问题）。
 * 一张卡三句话：title=结论一句；涉及 mod；怎么办。reason 可省。 */
function cfCardHtml(m, c, i) {
  var lv = c.lv === 'red' ? 'red' : 'orange';
  var h = '';
  if (i > 0) h += '<div style="border-top:1px solid #2a2f3d;margin-top:14px"></div>';
  h += '<h3>' + chipHtml(lv, c.g || icGlyph({ k: lv, click: 'cf' })) + esc((c.tag || '提示') + ' · ' + m.name) + '</h3>'
    + '<div class="__mc-m-sub">' + esc(c.title || '') + '</div>';
  if ((c.who || []).length)
    h += '<div class="__mc-m-sec"><div class="__mc-m-h">涉及 mod</div>'
      + '<div class="__mc-m-txt"><b style="color:#e8e6e0">' + esc(c.who.join('、')) + '</b></div></div>';
  if (c.reason)
    h += '<div class="__mc-m-sec"><div class="__mc-m-h">原因</div><div class="__mc-m-txt">' + esc(c.reason) + '</div></div>';
  var tips = c.tips || [];
  if (tips.length) {
    h += '<div class="__mc-m-sec"><div class="__mc-m-h">怎么办</div><div class="__mc-m-txt">';
    for (var j = 0; j < tips.length; j++) h += (j > 0 ? '<br>' : '') + (j + 1) + '. ' + esc(tips[j]);
    h += '</div></div>';
  }
  return h;
}

function cfModalHtml(m, cards) {
  var h = '';
  for (var i = 0; i < cards.length; i++) h += cfCardHtml(m, cards[i], i);
  h += '<div class="__mc-m-acts"><button type="button" class="__mc-btn __mc-btn-mini" data-mact="close">关闭</button>'
    + '<button type="button" class="__mc-btn __mc-btn-mini" data-mact="cfoff" data-guid="' + esc(m.guid) + '">停用此 mod</button>'
    + '<button type="button" class="__mc-btn __mc-btn-pri __mc-btn-mini" data-mact="cforder">去调序</button>'
    + '<button type="button" class="__mc-btn __mc-btn-danger __mc-btn-mini" data-mact="cfdel" data-guid="' + esc(m.guid) + '">卸载此 mod…</button></div>';
  return h;
}

function patchOwnerName(g) {
  var m = findMod(g);
  return m ? m.name : '未知 mod';
}

function patchModalHtml() {
  var s = ST.scan;
  var h = '<h3>' + chipHtml('orange', '⇄') + '补丁碰撞</h3>';
  if (!s) {
    return h + '<div class="__mc-m-sub">正在读取扫描结果…</div>'

  }
  if (s.error) {
    h += '<div class="__mc-risk">' + esc(s.error) + '</div>';
  } else {
    h += '<div class="__mc-m-sub">有 ' + (s.total || 0) + ' 处游戏逻辑被多个 mod 同时修改，后加载的会覆盖先加载的。一般不用处理；游戏行为异常时再来看。</div>'
      + '<div class="__mc-m-sec"><div class="__mc-m-h">碰撞位置</div>';
    var items = s.items || [];
    if (!items.length) h += '<div class="__mc-m-txt">没有发现碰撞。</div>';
    for (var i = 0; i < items.length; i++) {
      var it = items[i] || {};
      h += '<div class="__mc-scan-grp"><div class="__mc-scan-m">' + esc(it.method || '?') + '</div>'
        + '<div class="__mc-scan-o">' + esc((it.owners || []).map(patchOwnerName).join('、')) + '</div></div>';
    }
    h += '</div>';
    var fw = s.frameItems || [];
    if (fw.length) {
      h += '<div class="__mc-m-sec"><div class="__mc-m-h">另有 ' + (s.framework || fw.length) + ' 处框架内部碰撞</div>'
        + '<div class="__mc-m-txt" style="font-size:11.5px">不影响游戏逻辑，未计入上面的数字。</div>'
        + '<div class="__mc-scan-grp">';
      for (var fi = 0; fi < fw.length; fi++) {
        var fit = fw[fi] || {};
        h += '<div class="__mc-scan-m">' + esc(fit.method || '?') + '</div>'
          + '<div class="__mc-scan-o">' + esc((fit.owners || []).map(patchOwnerName).join('、')) + '</div>';
      }
      h += '</div></div>';
    }
  }
  h += '<div class="__mc-m-acts"><button type="button" class="__mc-btn __mc-btn-mini" data-pact="rescan"'
    + (ST.scanWait ? ' disabled' : '') + '>' + (ST.scanWait ? '扫描中…' : '重新扫描') + '</button>'
    + '<button type="button" class="__mc-btn __mc-btn-mini" data-mact="close">关闭</button></div>';
  return h;
}

function repoVerbOf(r) {
  if (r.status === 'downgrade') return '降级';
  if (r.local == null || r.status === 'install') return '安装';
  return '更新';
}

/* 更新确认弹窗（v3 精简）：版本对比一行 + 告警（仅异常时出现）+ 一句生效说明。 */
function updModalRealHtml(r) {
  var isDown = r.status === 'downgrade', isWarn = r.status === 'warn';
  var isInst = r.local == null || r.status === 'install';
  var chip = isDown ? chipHtml('orange', '↓') : chipHtml('blue', '↑');
  var verb = repoVerbOf(r);
  var h = '<h3>' + chip + verb + ' · ' + esc(r.name) + '</h3>'
    + '<div class="__mc-kv" style="padding:2px 0 0"><span class="__mc-kvv">' + esc(r.local || '未安装') + '</span>'
    + '<span style="color:#6b7180">→</span>'
    + '<span class="__mc-kvv" style="color:' + (isDown ? '#fbbf24' : '#60a5fa') + ';font-size:14px">' + esc(r.remote) + '</span></div>';
  if (isDown) h += '<div class="__mc-risk">⚠ 本地 ' + esc(r.local) + ' 比远端新。旧版可能和存档、其他 mod 不匹配，确定要降级吗？</div>';
  else if (isWarn) h += '<div class="__mc-risk">⚠ ' + esc(r.why || '该版本可能不适配当前游戏') + '，有闪退风险，确定要继续吗？</div>';
  else if (r.kbw && r.kbwhy) h += '<div class="__mc-risk">⚠ ' + esc(r.kbwhy) + '，有闪退风险，确定要继续吗？</div>';

  h += '<div class="__mc-m-sec"><div class="__mc-m-txt">下载并校验后暂存，<b style="color:#e8e6e0">重启游戏</b>时自动替换（不保留旧版）。</div></div>'
    + '<div class="__mc-m-acts"><button type="button" class="__mc-btn __mc-btn-mini" data-mact="close">取消</button>'
    + '<button type="button" class="__mc-btn ' + (isDown ? '__mc-btn-org' : (isInst ? '__mc-btn-blue' : '__mc-btn-pri'))
    + '" data-mact="doupd" data-repo="' + esc(r.repoKey) + '">' + esc(verb === '安装' ? '安装 ' : verb + '到 ') + esc(r.remote) + '</button></div>';
  return h;
}

/* 确认后的进度弹窗（就地更新，不重建） */
function updModalDlHtml(r, dl) {
  var chip = r.status === 'downgrade' ? chipHtml('orange', '↓') : chipHtml('blue', '↑');
  var st = dl ? dl.stage : 'down';
  var pct = dl && typeof dl.pct === 'number' ? dl.pct : 0;
  return '<h3>' + chip + repoVerbOf(r) + ' · ' + esc(r.name) + '</h3>'
    + '<div class="__mc-m-sec"><div class="__mc-m-h">进行中</div>'
    + '<div class="__mc-m-txt" id="__mc_dltx">' + esc(dlStageText(st, pct)) + '</div>'
    + '<div class="__mc-dlbar"><i id="__mc_dlfill" style="width:' + (st === 'down' ? pct : 100) + '%"></i></div></div>'
    + '<div class="__mc-m-acts"><button type="button" class="__mc-btn __mc-btn-mini" data-mact="close">隐藏</button></div>';
}

function updModalDoneHtml(r) {
  return '<h3>' + chipHtml('amber', '⟳') + '已就绪 · ' + esc(r.name) + '</h3>'
    + '<div class="__mc-m-sec"><div class="__mc-m-txt">已下载并校验。<b style="color:#e8e6e0">重启游戏</b>后自动替换。</div></div>'
    + '<div class="__mc-m-acts"><button type="button" class="__mc-btn __mc-btn-pri __mc-btn-mini" data-mact="close">关闭</button></div>';
}

function updModalErrHtml(r, err) {
  return '<h3>' + chipHtml('red', '⚠') + repoVerbOf(r) + '失败 · ' + esc(r.name) + '</h3>'
    + '<div class="__mc-risk">' + esc(err || '未知错误') + '</div>'
    + '<div class="__mc-m-sec"><div class="__mc-m-txt">没有做任何更改，稍后可重试。</div></div>'
    + '<div class="__mc-m-acts"><button type="button" class="__mc-btn __mc-btn-mini" data-mact="close">关闭</button></div>';
}

function uninstModalHtml(d) {
  var h = '<h3>' + chipHtml('red', '⚠') + '卸载 · ' + esc(d.name) + '</h3>'
    + '<div class="__mc-m-sub">将删除以下内容，重启游戏后执行。存档和其他 mod 不受影响。</div>'
    + '<div class="__mc-files">';

    h += '<div class="__mc-file-del">BepInEx\\' + esc(String(fs[i]).replace(/\//g, '\\')) + '</div>';

  if (d.note) h += '<div class="__mc-m-sec"><div class="__mc-m-txt" style="font-size:11px;color:#8a90a0">ⓘ ' + esc(d.note) + '</div></div>';
  if (d.self) h += '<div class="__mc-risk">⚠ 这是面板自己：要重启两次才能删干净（第一次打标记，第二次删文件、入口消失）。引导壳属基座组件会保留。</div>';
  h += '<div class="__mc-m-acts"><button type="button" class="__mc-btn __mc-btn-mini" data-mact="close">取消</button>'
    + '<button type="button" class="__mc-btn __mc-btn-danger" data-mact="douninst" data-guid="' + esc(d.guid) + '">确认卸载</button></div>';
  return h;
}

function setModal(html) {
  if (!S.mdl || !S.mbg) return false;
  S.mdl.innerHTML = html;
  var closes = S.mdl.querySelectorAll('[data-mact="close"]');
  for (var i = 0; i < closes.length; i++)
    closes[i].addEventListener('click', function (e) { e.stopPropagation(); closeModal(); });
  return true;
}
function openModal(html) {
  if (!setModal(html)) return;
  S.mdlRepoKey = null;
  S.mbg.className = '__mc-modal-bg __mc-show';
}
function closeModal() {
  if (S.mbg) S.mbg.className = '__mc-modal-bg';
  ST.cfGuid = null;
  ST.patchOpen = false; ST.scanWait = false;
  if (demoDlTimer) { clearInterval(demoDlTimer); demoDlTimer = null; }
}
function modalOpen() {
  return !!(S.mbg && S.mbg.className.indexOf('__mc-show') !== -1);
}

function renderPending() {
  if (!S.pendEl) return;
  var p = ST.pend;
  var labels = p && p.labels ? p.labels : [];
  var applied = p && p.applied ? p.applied : null;
  if (!labels.length && !applied) {
    S.pendEl.className = '__mc-pending';
    return;
  }
  S.pendEl.className = '__mc-pending __mc-show' + (labels.length ? '' : ' __mc-weak');
  var h = '';
  if (labels.length)
    h += esc('待生效 ' + labels.length + ' 项（' + labels.join(' · ') + '）· 重启游戏后应用');
  if (applied)
    h += (h ? ' · ' : '') + '<span style="color:#8a90a0">' + esc(applied) + '</span>';
  S.pendTx.innerHTML = h;
}

function openRebootModal() {
  var n = ST.pend && ST.pend.n ? ST.pend.n : 0;
  openModal('<h3>' + chipHtml('amber', '↻') + '立即重启</h3>'
    + '<div class="__mc-m-sub">退出游戏，约 10 秒后自动回来。</div>'
    + '<div class="__mc-risk">⚠ 未保存的对局进度会丢失。</div>'
    + (n > 0 ? '<div class="__mc-m-sec"><div class="__mc-m-txt">重启后自动应用 ' + n + ' 项待生效操作。</div></div>' : '')
    + '<div class="__mc-m-acts"><button type="button" class="__mc-btn __mc-btn-mini" data-mact="close">取消</button>'
    + '<button type="button" class="__mc-btn __mc-btn-pri" data-mact="doreboot">确认重启</button></div>');
  var go = S.mdl.querySelector('[data-mact="doreboot"]');
  if (!go) return;
  go.addEventListener('click', function (e) {
    e.stopPropagation();
    send({ type: 'MC_RESTART' });
    closeModal();
    toastRaw('正在重启游戏…', '本进程退出后经 Steam 自动重拉');
  });
}

/* ---- 交互接线（panel.js wireSide/wireCfg 移植） ---- */

function toggleMod(guid) {
  if (guid === '__self') return;
  var m = findMod(guid);
  if (!m) return;
  m.enabled = !m.enabled;
  renderSide(); renderCfg();
  send({ type: 'MC_TOGGLE_MOD', guid: guid, enabled: m.enabled });
  var tp = isTpMod(m);
  if (tp) {
    if (m.enabled) {
      toastRaw(m.name + ' 已启用', '下次启动加载');
    } else {
      toastRaw(m.name + ' 已停用',
        m.soft ? '行为已停止 · 下次启动不再加载' : '本次仍在运行 · 下次启动不再加载');
    }
    return;
  }
  toastRaw(m.name + (m.enabled ? ' 已启用' : ' 已停用'),
    m.enabled ? '已生效' : '已还原 · 下次启动不再加载');
}

function syncSibling(el, v) {
  var ctl = el.closest('.__mc-ctl');
  if (!ctl) return;
  var all = ctl.querySelectorAll('input');
  for (var i = 0; i < all.length; i++) if (all[i] !== el) all[i].value = fmt(v);
}

function routeOf(k) {
  var i = String(k).indexOf('.');
  return i === -1 ? ['', k] : [String(k).slice(0, i), String(k).slice(i + 1)];
}
function sendSet(m, it, value) {
  var r = routeOf(it.k);
  send({ type: 'MC_SET', guid: m.guid, section: r[0], key: it.k, value: value });
}
function serializeOvr(m) {
  return (m.ovr || []).slice().sort(function (a, b) { return a.id - b.id; })
    .map(function (o) { return o.id + ':' + o.ms; }).join(',');
}
function ovrCommit(m) { send({ type: 'MC_SET', guid: m.guid, section: OVR_SECTION, key: OVR_KEY, value: serializeOvr(m) }); }
function serializeBov(m) {
  return (m.bagOvr || []).slice().sort(function (a, b) { return a.id - b.id; })
    .map(function (o) { return o.id + ':' + o.w + 'x' + o.h; }).join(',');
}
function bovCommit(m) { send({ type: 'MC_SET', guid: m.guid, section: BOV_SECTION, key: BOV_SECTION + '.' + BOV_KEY, value: serializeBov(m) }); }

/* 100ms 节流（滑条连发合并） */
function throttleSend(id, fn) {
  var now = Date.now();
  var t = TH[id] || (TH[id] = { last: 0, timer: null, pending: null });
  if (now - t.last >= 100) {
    t.last = now; t.pending = null; fn();
  } else {
    t.pending = fn;
    if (t.timer == null) {
      t.timer = setTimeout(function () {
        var p = TH[id]; if (!p) return;
        p.timer = null; p.last = Date.now();
        var f = p.pending; p.pending = null;
        if (f) f();
      }, 100 - (now - t.last));
    }
  }
}

/* ---- 排序模式 ---- */
function ordToggle() {
  if (ST.ord) {
    ST.ord = false; ST.order = null; ST.ordSaving = false; ORD.src = null;
    renderSide(); renderCfg();
    return;
  }
  ST.ord = true; ST.order = null; ST.ordSaving = false; ORD.src = null;
  renderSide(); renderCfg();
  /* 原型直接给数据（游戏内走 MC_ORDER_GET/MC_ORDER_DATA） */
  ST.ordRows = MOCK.order;
  ST.order = MOCK.order.guids.slice();
  renderSide();
}
function ordReset() {
  if (!ST.ordRows || !ST.ordRows.def || !ST.ordRows.def.length) return;
  ST.order = ST.ordRows.def.slice();
  renderSide();
  toastRaw('已恢复默认顺序', '尚未保存——点「保存顺序」后生效');
}
function ordSave() {
  if (!ST.order || !ST.order.length || ST.ordSaving) return;
  ST.ordSaving = true;
  send({ type: 'MC_ORDER_SAVE', guids: ST.order.slice() });
  setTimeout(function () {
    ST.ordSaving = false;
    if (ST.ord) { ST.ord = false; ST.order = null; renderSide(); renderCfg(); }
    toastRaw('顺序已保存', '重启游戏后生效');
    ST.pend = { n: 3, labels: ['更新 动作加速', '卸载 角色解锁', '加载顺序调整'] };
    renderPending();
  }, 500);
}
function ordIndexOf(guid) {
  if (!ST.order) return -1;
  for (var i = 0; i < ST.order.length; i++) if (ST.order[i] === guid) return i;
  return -1;
}
function ordReorderLocal(from, to) {
  if (!ST.order) return;
  if (from === to || from < 0 || to < 0 || from >= ST.order.length) return;
  var g = ST.order.splice(from, 1)[0];
  if (to > ST.order.length) to = ST.order.length;
  ST.order.splice(to, 0, g);
  renderSide();
}
function ordClearDrops() {
  if (!S.side) return;
  var rows = S.side.querySelectorAll('.__mc-ord-row');
  for (var i = 0; i < rows.length; i++) {
    rows[i].classList.remove('__mc-drop-above');
    rows[i].classList.remove('__mc-drop-below');
  }
}
function ordFocusRow(i) {
  if (!S.side) return;
  var rows = S.side.querySelectorAll('.__mc-ord-row');
  if (rows[i]) rows[i].focus();
}

function wireSide(side) {
  side.addEventListener('click', function (e) {
    var oa = e.target.closest
      ? e.target.closest('[data-act="ordtoggle"],[data-act="ordreset"],[data-act="ordsave"]') : null;
    if (oa) {
      e.stopPropagation();
      var a = oa.getAttribute('data-act');
      if (a === 'ordtoggle') ordToggle();
      else if (a === 'ordreset') ordReset();
      else if (a === 'ordsave') ordSave();
      return;
    }
    var ent = e.target.closest ? e.target.closest('[data-act="repo-open"]') : null;
    if (ent) { e.stopPropagation(); return; } /* v3：侧栏无仓库入口（兼容残留点击） */
    var sw = e.target.closest ? e.target.closest('[data-act="toggle"]') : null;
    if (sw) { e.stopPropagation(); toggleMod(sw.getAttribute('data-guid')); return; }
    var ic = e.target.closest ? e.target.closest('.__mc-ic') : null;
    if (ic) {
      e.stopPropagation();
      var click = ic.getAttribute('data-click');
      if (!click) return;
      var m = findMod(ic.getAttribute('data-guid'));
      if (!m) return;
      if (click === 'cf') openCfModal(m);
      else if (click === 'upd') openUpdModal(m);
      return;
    }
    var row = e.target.closest ? e.target.closest('.__mc-mod-row') : null;
    if (row) {
      if (ST.ord) return;
      ST.sel = row.getAttribute('data-guid'); renderSide(); renderCfg();
    }
  });

  side.addEventListener('dragstart', function (e) {
    if (!ST.ord || !ST.order) return;
    var row = e.target.closest ? e.target.closest('.__mc-ord-row') : null;
    if (!row) return;
    ORD.src = row.getAttribute('data-guid');
    if (e.dataTransfer) {
      try { e.dataTransfer.setData('text/plain', String(ORD.src)); } catch (_) {}
      e.dataTransfer.effectAllowed = 'move';
    }
    row.classList.add('__mc-dragging');
  });
  side.addEventListener('dragend', function (e) {
    var row = e.target.closest ? e.target.closest('.__mc-ord-row') : null;
    if (row) row.classList.remove('__mc-dragging');
    ordClearDrops();
    ORD.src = null;
  });
  side.addEventListener('dragover', function (e) {
    if (!ST.ord || ORD.src == null || !ST.order) return;
    var row = e.target.closest ? e.target.closest('.__mc-ord-row') : null;
    if (!row) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    ordClearDrops();
    var r = row.getBoundingClientRect();
    row.classList.add(e.clientY < r.top + r.height / 2 ? '__mc-drop-above' : '__mc-drop-below');
  });
  side.addEventListener('dragleave', function (e) {
    var row = e.target.closest ? e.target.closest('.__mc-ord-row') : null;
    if (row) { row.classList.remove('__mc-drop-above'); row.classList.remove('__mc-drop-below'); }
  });
  side.addEventListener('drop', function (e) {
    if (!ST.ord || ORD.src == null || !ST.order) return;
    e.preventDefault();
    ordClearDrops();
    var row = e.target.closest ? e.target.closest('.__mc-ord-row') : null;
    var srcGuid = ORD.src;
    ORD.src = null;
    if (!row || srcGuid == null) return;
    var src = ordIndexOf(srcGuid);
    if (src < 0) return;
    var r = row.getBoundingClientRect();
    var below = e.clientY >= r.top + r.height / 2;
    var to = ordIndexOf(row.getAttribute('data-guid')) + (below ? 1 : 0);
    if (to > src) to--;
    ordReorderLocal(src, to);
  });
  side.addEventListener('keydown', function (e) {
    if (!ST.ord || !ST.order) return;
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    var row = e.target.closest ? e.target.closest('.__mc-ord-row') : null;
    if (!row) return;
    e.preventDefault();
    var i = ordIndexOf(row.getAttribute('data-guid'));
    if (i < 0) return;
    var to = e.key === 'ArrowUp' ? i - 1 : i + 1;
    ordReorderLocal(i, to);
    ordFocusRow(to);
  });
}

function wireCfg(cfg) {
  cfg.addEventListener('click', function (e) {
    var t = e.target;
    if (!t.closest) return;
    var ra = t.closest('[data-ract]');
    if (ra) {
      var ract = ra.getAttribute('data-ract');

    }
    var un = t.closest('[data-act="uninst"]');

    var m = curMod();
    if (!m) return;
    var sw = t.closest('.__mc-mini-sw[data-act="set"]');
    if (sw) {
      var it = itemOf(m, +sw.getAttribute('data-g'), +sw.getAttribute('data-i'));
      if (!it) return;
      it.v = !it.v;
      sw.className = '__mc-mini-sw __mc-big' + (it.v ? ' __mc-on' : '');
      sw.setAttribute('aria-checked', String(!!it.v));
      sendSet(m, it, it.v);

    }
    var add = t.closest('[data-act="ovr-add"]');

      var inp = S.cfg.querySelector('#__mc_ovr_new');
      var id = inp ? parseInt(inp.value, 10) : NaN;
      if (!isNaN(id) && id > 0 && !m.ovr.some(function (o) { return o.id === id; })) {
        m.ovr.push({ id: id, ms: 1000 });
        renderCfg();
        ovrCommit(m);
        toast(m.name + ' · 新增覆写 #' + id + '（默认 1000ms）', 'now');
      }
      return;
    }
    var del = t.closest('[data-act="ovr-del"]');
    if (del) {
      if (!m.ovr) return;
      var idx = +del.getAttribute('data-idx');
      if (idx >= 0 && idx < m.ovr.length) {
        var gone = m.ovr[idx].id;
        m.ovr.splice(idx, 1);
        renderCfg();
        ovrCommit(m);
        toast(m.name + ' · 已删除覆写 #' + gone, 'now');
      }
      return;
    }
    var badd = t.closest('[data-act="bov-add"]');
    if (badd) {
      if (!m.bagOvr) return;
      var binp = S.cfg.querySelector('#__mc_bov_new');
      var bid = binp ? parseInt(binp.value, 10) : NaN;
      if (!isNaN(bid) && bid > 0 && !(m.bagOvr).some(function (o) { return o.id === bid; })) {
        m.bagOvr.push({ id: bid, w: 16, h: 12 });
        renderCfg();
        bovCommit(m);
        toast(m.name + ' · 新增柜子 #' + bid + '（默认 16x12，优先级最高）', 'now');
      }
      return;
    }
    var bdel = t.closest('[data-act="bov-del"]');
    if (bdel) {
      if (!m.bagOvr) return;
      var bidx = +bdel.getAttribute('data-idx');
      if (bidx >= 0 && bidx < m.bagOvr.length) {
        var bgone = m.bagOvr[bidx].id;
        m.bagOvr.splice(bidx, 1);
        renderCfg();
        bovCommit(m);
        toast(m.name + ' · 已删除柜子 #' + bgone + '（回落到专属/通用）', 'now');
      }
    }
  });

  cfg.addEventListener('input', function (e) {
    var el = e.target;
    if (!el.getAttribute) return;
    var dnum = el.getAttribute('data-num');
    if (dnum) {
      var sv = (el.value || '').replace(/[^\d.]/g, '');
      if (dnum === 'int') sv = sv.replace(/\./g, '');
      else { var sp = sv.split('.'); sv = sp.length > 1 ? sp[0] + '.' + sp.slice(1).join('') : sv; }
      if (sv !== el.value) el.value = sv;
    }
    var act = el.getAttribute('data-act');
    if (!act) return;
    var m = curMod();
    if (!m) return;
    if (act === 'ovr-set') {
      if (!m.ovr) return;
      var o = m.ovr[+el.getAttribute('data-idx')];
      if (!o) return;
      var ov = parseFloat(el.value);
      if (isNaN(ov)) return;
      o.ms = Math.round(Math.max(0, Math.min(5000, ov)));
      syncSibling(el, o.ms);
      var ck = el.closest('.__mc-item');
      if (ck) {
        var ckEl = ck.querySelector('.__mc-ck');
        if (ckEl) ckEl.textContent = OVR_SECTION + '.' + OVR_KEY + ' · ' + o.id + ':' + o.ms;
      }
      throttleSend('ovr' + el.getAttribute('data-idx'), function () { ovrCommit(m); });
      toast(m.name + ' · 覆写 #' + o.id + ' → ' + o.ms + 'ms', 'now');
      return;
    }
    if (act === 'bov-set') {
      if (!m.bagOvr) return;
      var bo = m.bagOvr[+el.getAttribute('data-idx')];
      if (!bo) return;
      var bk = el.getAttribute('data-k');
      var bv = parseFloat(el.value);
      if (isNaN(bv)) return;
      bv = Math.round(Math.max(0, Math.min(bk === 'w' ? 40 : 30, bv)));
      bo[bk] = bv;
      var bck = el.closest('.__mc-item');
      if (bck) {
        var bckEl = bck.querySelector('.__mc-ck');
        if (bckEl) bckEl.textContent = BOV_SECTION + '.' + BOV_KEY + ' · ' + bo.id + ':' + bo.w + 'x' + bo.h;
      }
      if (String(bv) !== el.value) el.value = String(bv);
      throttleSend('bov' + el.getAttribute('data-idx') + bk, function () { bovCommit(m); });
      toast(m.name + ' · 柜子 #' + bo.id + ' ' + (bk === 'w' ? '宽' : '高') + ' → ' + bv, 'now');
      return;
    }
    if (act !== 'set') return;
    if (el.tagName === 'SELECT') return;
    if (el.type !== 'range' && !el.getAttribute('data-num')) return;
    var it = itemOf(m, +el.getAttribute('data-g'), +el.getAttribute('data-i'));
    if (!it) return;
    var v = parseFloat(el.value);
    if (isNaN(v)) return;
    v = clampItem(it, v);
    if (it.t === 'int') v = Math.round(v);
    it.v = v;
    syncSibling(el, v);
    throttleSend('g' + el.getAttribute('data-g') + 'i' + el.getAttribute('data-i'), function () { sendSet(m, it, it.v); });
    toast(m.name + ' · ' + it.l + ' → ' + fmt(v), it.b);
  });

  cfg.addEventListener('change', function (e) {
    var el = e.target;
    if (!el.getAttribute) return;
    var act = el.getAttribute('data-act');
    if (act !== 'set') return;
    var m = curMod();
    if (!m) return;
    var it = itemOf(m, +el.getAttribute('data-g'), +el.getAttribute('data-i'));
    if (!it) return;
    if (el.tagName === 'SELECT') {
      it.v = el.value;
      sendSet(m, it, it.v);
      toast(m.name + ' · ' + it.l + ' → ' + el.value, it.b);
    } else if (el.getAttribute('data-num')) {
      el.value = fmt(it.v);
    } else if (el.tagName === 'INPUT' && el.type === 'text') {
      it.v = el.value;
      sendSet(m, it, it.v);
      toast(m.name + ' · ' + it.l + ' → ' + el.value, it.b);
    }
  });
}

/* 原型专用：模拟 MC_DL 进度链（down→check→unzip→write→ok） */
var demoDlTimer = null;
function demoSimulateDl(row) {
  if (demoDlTimer) clearInterval(demoDlTimer);
  var stages = [
    { stage: 'down', pct: 18 }, { stage: 'down', pct: 47 }, { stage: 'down', pct: 76 },
    { stage: 'down', pct: 100 }, { stage: 'check', pct: 100 }, { stage: 'unzip', pct: 100 },
    { stage: 'write', pct: 100 }, { stage: 'ok', pct: 100 },
  ];
  var i = 0;
  demoDlTimer = setInterval(function () {
    var ev = stages[i++];
    if (!ev || !modalOpen()) { clearInterval(demoDlTimer); demoDlTimer = null; return; }
    onDlEvent({ repoKey: row.repoKey, pct: ev.pct, stage: ev.stage });
    if (ev.stage === 'ok') {
      clearInterval(demoDlTimer); demoDlTimer = null;
      row.pending = true;
      ST.pend = { n: 3, labels: ['更新 ' + row.name, '卸载 角色解锁', '加载顺序调整'] };
      renderSide(); renderCfg(); renderPending();
    }
  }, 550);
}

function onDlEvent(ev) {
  ST.dl = { repoKey: ev.repoKey, pct: ev.pct, stage: ev.stage };
  if (S.mdlRepoKey === ev.repoKey && modalOpen() && S.mdl) {
    if (ev.stage === 'ok') {
      setModal(updModalDoneHtml(repoRowOf(ev.repoKey) || { name: ev.repoKey, repoKey: ev.repoKey }));
    } else if (ev.stage === 'err') {
      setModal(updModalErrHtml(repoRowOf(ev.repoKey) || { name: ev.repoKey, repoKey: ev.repoKey }, ev.err));
    } else {
      var fill = S.mdl.querySelector('#__mc_dlfill');

      if (fill) fill.style.width = (ev.stage === 'down' ? ev.pct : 100) + '%';
      if (tx) tx.textContent = dlStageText(ev.stage, ev.pct);
    }
  }
}

  } else {
    var m = findMod(guid);
    var isTp = m && isTpMod(m);
    d = {
      guid: guid, name: m ? m.name : guid,
      files: isTp
        ? ['plugins\\' + (m.en || 'ThirdParty') + '.dll']
        : ['plugins\\SurvivalLog.' + (m ? m.en : '?') + '.dll', 'config\\com.local.survivallog.' + (m ? m.en.toLowerCase() : '?') + '.cfg'],
      note: isTp ? '第三方 dll：一并清理面板内的停用标记。' : null,
    };
  }
  openModal(uninstModalHtml(d));
  var go = S.mdl.querySelector('[data-mact="douninst"]');
  if (!go) return;
  go.addEventListener('click', function (e) {
    e.stopPropagation();
    send({ type: 'MC_UNINST_DO', guid: d.guid });
    closeModal();
    var labels = ['卸载 ' + d.name];
    if (ST.pend && ST.pend.labels) labels = labels.concat(ST.pend.labels);
    ST.pend = { n: labels.length, labels: labels };
    renderSide(); renderPending();
    toastRaw('已加入待生效：卸载 ' + d.name, '重启游戏后执行');
  });
}

/* ---- 待生效条两钮（panel.js 同款委托） ---- */
S.pendEl.addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('[data-x]') : null;
  if (!b) return;
  var x = b.getAttribute('data-x');
  if (x === 'undo') {
    send({ type: 'MC_PENDING_UNDO' });
    ST.pend = null; renderSide(); renderPending();
    toastRaw('已撤销待生效操作', '加载顺序也恢复默认');
    return;
  }
  if (x === 'reboot') openRebootModal();
});

/* ---- ESC / 关闭（原型：面板常驻，只关弹窗） ---- */
S.mbg.addEventListener('click', function (e) { if (e.target === S.mbg) closeModal(); });
document.addEventListener('keydown', function (e) {
  if (e && e.key !== 'Escape') return;
  if (modalOpen()) { closeModal(); return; }
  toastRaw('（原型）此处将关闭面板', '游戏内由 __mcClose 拆面板并发 MC_CLOSE');
});

/* ============================================================================
 * demo 区：场景切换条（原型专用）
 * ========================================================================== */
function demoView(v) {
  if (v === 'ord') { if (!ST.ord) ordToggle(); return; }
  if (ST.ord) ordToggle();
  renderSide(); renderCfg();
}

function demoOpen(name) {
  if (ST.ord) ordToggle();
  renderSide(); renderCfg();
  switch (name) {
    case 'm-cf': openCfModal(findMod('com.local.survivallog.cabinetsize')); break;
    case 'm-upd': openRepoModal(repoRowOf('fridgechill')); break;
    case 'm-down': openRepoModal(repoRowOf('quickaction')); break;
    case 'm-warn': openRepoModal(repoRowOf('cabinetsize')); break;
    case 'm-inst': openRepoModal(repoRowOf('roleunlock')); break;
    case 'm-dl': {
      var r = repoRowOf('endlessguard');
      openModal(updModalDlHtml(r, null));
      S.mdlRepoKey = r.repoKey;
      demoSimulateDl(r);
      break;
    }
    case 'm-done': openModal(updModalDoneHtml(repoRowOf('robotspeed'))); break;
    case 'm-uninst': openUninstDemo('com.local.survivallog.fridgechill'); break;
    case 'm-uninst-self': openUninstDemo(SELF_GUID); break;
    case 'm-scan': openPatchModal(); break;
    case 'm-reboot': openRebootModal(); break;
  }
}

/* demo 动作统一委托到 document：demo 条、面板头「检查更新」、底部碰撞按钮、✕ 都带 data-demo */
document.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('[data-demo]') : null;
  if (!b) return;
  var d = b.getAttribute('data-demo');
  if (d === 'view-cfg') demoView('cfg');
  else if (d === 'view-ord') demoView('ord');
  else if (d === 'check-upd') {
    toastRaw('正在检查更新…', '');
    setTimeout(function () {
      var c = repoCounts(), parts = [];
      if (c.upd) parts.push(c.upd + ' 个可更新');
      if (c.inst) parts.push(c.inst + ' 个可安装');
      if (c.warn) parts.push(c.warn + ' 个版本待确认');
      toastRaw(parts.length ? '检查完成：' + parts.join('、') : '检查完成：都是最新版',
        parts.length ? '列表里已用图标标出，点图标或进详情处理' : '');
      renderPatchBtn();
    }, 700);
  }
  else if (d === 'pend-on') { ST.pend = { n: 3, labels: ['更新 动作加速', '卸载 角色解锁', '加载顺序调整'] }; renderPending(); }
  else if (d === 'pend-applied') { ST.pend = { n: 0, labels: [], applied: '自定义加载序生效中' }; renderPending(); }
  else if (d === 'pend-off') { ST.pend = null; renderPending(); }
  else if (d === 'toast-ok') toast('保鲜增强 · 保鲜时长倍率 → 2.5', 'now');
  else if (d === 'toast-err') toast('✕ 保鲜时长倍率', null, true, '值超出范围 0.1~10');
  else if (d === 'panel-close') toastRaw('（原型）此处将关闭面板', '游戏内由 __mcClose 拆面板并发 MC_CLOSE');
  else demoOpen(d);
});

/* 底部「补丁碰撞 N 组」按钮（有碰撞才显示） */
function renderPatchBtn() {
  var b = document.getElementById('__mc_patch_btn');
  if (!b) return;
  var s = ST.scan, n = s && !s.error ? (s.total || 0) : 0;
  b.style.display = n > 0 ? '' : 'none';
  b.textContent = '补丁碰撞 ' + n + ' 组';
}

/* ---- 启动 ---- */
wireSide(S.side);
wireCfg(S.cfg);
renderSide();
renderCfg();
renderPending();
renderPatchBtn();
</script>
</body>
</html>
